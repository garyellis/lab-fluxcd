apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: edge-http-redirect
  namespace: istio-ingress
spec:
  selector:
    app: istio-ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
      tls:
        httpsRedirect: true
