apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: edge-http-redirect
  namespace: istio-ingress
spec:
  selector:
    app: istio-ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
      tls:
        httpsRedirect: true
---
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: edge-local-ingress
  namespace: istio-ingress
  labels:
    platform.garys-lab.io/cluster: edge-w
    platform.garys-lab.io/managed-by: ansible-platform-bootstrap
spec:
  selector:
    app: istio-ingressgateway
  servers:
    - port:
        number: 443
        name: https-edge-w
        protocol: HTTPS
      hosts:
        - "*.edge-w.int.garys-lab.io"
      tls:
        mode: SIMPLE
        credentialName: edge-w-wildcard-tls
