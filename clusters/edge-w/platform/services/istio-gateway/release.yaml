apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-ingressgateway
  namespace: istio-ingress
spec:
  interval: 10m
  releaseName: istio-ingressgateway
  chart:
    spec:
      chart: istio-gateway
      version: "0.1.2"
      sourceRef:
        kind: HelmRepository
        name: lab-charts
        namespace: flux-system
      interval: 10m
  install:
    createNamespace: false
    remediation: {retries: 3}
  upgrade:
    remediation: {retries: 3}
  test:
    enable: true
    ignoreFailures: false
  targetNamespace: istio-ingress
  values:
    # The wrapper ships a standalone-install starter kit: an apps-gateway
    # Gateway, a self-signed CA chain with an apps-wildcard leaf, and a
    # hubble-ui VirtualService. All three are owned by this scaffold instead.
    #
    # The listener topology is role-aware here (an HTTP redirect at the edge, a
    # workload-ingress terminator elsewhere) and lives in gateway.yaml. The
    # issuing story is role-aware too -- ACME at the edge, the shared fleet CA
    # in workload clusters -- and lives in services/cert-manager-config plus
    # services/workload-certificate. Leaving the chart's versions on would mint
    # a second, competing root CA and a second Gateway contending for port 80.
    appsGateway:
      enabled: false
    certManager:
      enabled: false
    routes:
      hubbleUi:
        enabled: false
    gateway:
      podAnnotations:
        # Accept the PROXY header Octavia sends so Envoy sees the real client
        # address, then trust exactly that one hop when computing XFF. Downstream
        # clusters read the client IP from XFF, so no second PROXY hop is needed.
        proxy.istio.io/config: '{"gatewayTopology":{"proxyProtocol":{},"numTrustedProxies":1}}'
      labels:
        app: istio-ingressgateway
        istio: ingressgateway
      replicaCount: 2
      # The wrapper requires a node labelled node-role.kubernetes.io/edge and
      # tolerates a matching taint. No node in this fleet carries either:
      # kubeadm_join_worker applies node-role.kubernetes.io/worker, and edge-ness
      # is a property of the cluster, not of a node within it. Left in place the
      # required nodeAffinity would hold every replica Pending forever.
      #
      # Replaced rather than nulled: `nodeAffinity: null` does delete the
      # wrapper's terms, but Helm keeps the key and renders a literal
      # `nodeAffinity: null` into the Deployment. Restating the term says the
      # same thing the wrapper meant -- gateways belong on workers, never on
      # the control-plane node that also runs etcd and the apiserver -- in a
      # label this fleet actually applies. The emptied tolerations then keep
      # the pods off the NoSchedule-tainted control plane as a second gate.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/worker
                    operator: Exists
      tolerations: []
      # Both replicas must land on different workers: the edge ServiceEntry
      # targets both worker addresses on the same NodePort, and a single-node
      # placement would make one of those endpoints a black hole.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: istio-ingressgateway
      # The edge cluster owns shared north-south ingress. Its Service is the only
      # LoadBalancer in the fleet and drives the single shared Octavia amphora.
      #
      # The wrapper chart happens to carry the same annotations, but they are
      # restated here rather than inherited. spec section 7 requires the
      # floating address, PROXY protocol, and health-monitor settings to be
      # preserved, and lab-charts is a separate repository on its own release
      # cadence: silently losing proxy-protocol there would put the amphora
      # address in XFF and hand the WAF the wrong client IP, with nothing in
      # this repo to catch it.
      service:
        annotations:
          # Claim the OpenTofu-owned floating IP by address rather than letting
          # Octavia allocate a new one. spec.loadBalancerIP is deprecated upstream;
          # this annotation is what the OpenStack CCM actually honours.
          loadbalancer.openstack.org/load-balancer-address: "192.168.1.241"
          # Leave the floating IP behind when this Service is deleted. The address
          # is declared in OpenTofu and must outlive any single cluster.
          loadbalancer.openstack.org/keep-floatingip: "true"
          loadbalancer.openstack.org/proxy-protocol: "true"
          loadbalancer.openstack.org/enable-health-monitor: "true"
          loadbalancer.openstack.org/health-monitor-delay: "10"
          loadbalancer.openstack.org/health-monitor-timeout: "5"
          loadbalancer.openstack.org/health-monitor-max-retries: "3"
        # status-port is deliberately absent: Octavia creates one listener per
        # Service port, and 15021 has no business on a public floating IP. The
        # readiness probe reaches it on the pod directly, and the health monitor
        # checks the data ports.
        #
        # targetPort is the istio-proxy listener port, not the Gateway port.
        # istiod resolves a Gateway resource's port through this Service's
        # port -> targetPort mapping, so 80 -> 8080 and 443 -> 8443 keep the
        # proxy off privileged ports.
        ports:
          - name: http2
            port: 80
            protocol: TCP
            targetPort: 8080
          - name: https
            port: 443
            protocol: TCP
            targetPort: 8443
