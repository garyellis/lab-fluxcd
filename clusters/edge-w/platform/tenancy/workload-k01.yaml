apiVersion: v1
kind: Namespace
metadata:
  name: k01
  labels:
    app.kubernetes.io/managed-by: flux
    platform.garys-lab.io/cluster-group: k01
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workload-k01
  namespace: flux-system
  labels:
    platform.garys-lab.io/cluster-group: k01
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workload-k01-admin
  namespace: k01
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: workload-k01
    namespace: flux-system
