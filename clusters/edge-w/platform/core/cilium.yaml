apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 30m
  releaseName: cilium
  targetNamespace: kube-system
  storageNamespace: kube-system
  chart:
    spec:
      chart: cilium
      version: 1.20.0
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
      interval: 1h
  install:
    crds: CreateReplace
    remediation: {retries: 3}
  upgrade:
    crds: CreateReplace
    remediation: {retries: 3}
  values:
    cluster:
      name: "edge-w"
      id: 100

    kubeProxyReplacement: true
    # An address, never kube_api_fqdn. Cilium is the first workload on the cluster
    # and must reach the API server before CoreDNS exists, so it cannot depend on
    # any in-cluster resolver. It cannot use the node resolver either: the lab split
    # DNS routes int.garys-lab.io to 192.168.1.213 through a systemd-resolved
    # routing-only domain, which has no representation in a flat resolv.conf. kubelet
    # hands pods /run/systemd/resolve/resolv.conf, which lists only the global
    # 192.168.1.1, so kube-api.<cluster>.int.garys-lab.io does not resolve inside any
    # pod. `resolvectl query` on the node succeeds and hides this, because resolved
    # applies the routing domain that the copied file cannot express.
    k8sServiceHost: "10.128.0.11"
    k8sServicePort: "6443"

    ipam:
      mode: kubernetes
    routingMode: tunnel
    tunnelProtocol: vxlan
    MTU: 1400

    cni:
      exclusive: true

    socketLB:
      enabled: true
      hostNamespaceOnly: true

    bpf:
      masquerade: false

    hubble:
      enabled: true
      relay:
        enabled: false
      ui:
        # Relay and UI need schedulable worker capacity. Keep both disabled at the
        # control-plane bootstrap boundary; Flux can enable them after workers join.
        enabled: false

    resources:
      requests:
        cpu: 100m
        memory: 128Mi

    operator:
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
