apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: observability
spec:
  interval: 10m
  releaseName: grafana
  chart:
    spec:
      chart: grafana
      version: "0.1.0"
      sourceRef:
        kind: HelmRepository
        name: lab-charts
        namespace: flux-system
      interval: 10m
  install:
    createNamespace: false
    remediation: {retries: 3}
  upgrade:
    remediation: {retries: 3}
  targetNamespace: observability
  postRenderers:
    # The reviewed wrapper's route is retained, but its generic apps-gateway
    # reference is patched to obs-w's workload gateway.
    - kustomize:
        patches:
          - target:
              group: networking.istio.io
              version: v1
              kind: VirtualService
              name: grafana
            patch: |
              - op: replace
                path: /spec/gateways
                value:
                  - istio-ingress/workload-ingress
  values:
    appsDomain: "obs-w.int.garys-lab.io"
    grafana:
      rbac:
        create: false
      serviceAccount:
        create: true
        name: grafana
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      deploymentStrategy:
        type: Recreate
      replicas: 1
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {cpu: 500m, memory: 512Mi}
      persistence:
        enabled: false
      service:
        type: ClusterIP
        port: 80
      ingress:
        enabled: false
      route:
        main:
          enabled: false
      grafana.ini:
        server:
          domain: "grafana.obs-w.int.garys-lab.io"
          root_url: "https://grafana.obs-w.int.garys-lab.io/"
        analytics:
          reporting_enabled: false
          check_for_updates: false
        users:
          allow_sign_up: false
        auth.anonymous:
          enabled: true
          org_name: Main Org.
          org_role: Viewer
      datasources:
        datasources.yaml:
          apiVersion: 1
          datasources:
            - name: Thanos
              uid: thanos
              type: prometheus
              access: proxy
              url: http://thanos-query.observability.svc.cluster.local:9090
              isDefault: true
              editable: false
              jsonData:
                httpMethod: POST
                prometheusType: Prometheus
                timeInterval: 1m
      dashboards: {}
      dashboardProviders: {}
      sidecar:
        image:
          registry: quay.io
          repository: kiwigrid/k8s-sidecar
          tag: "2.2.1"
          sha: "a36a5946ea215ca6435a2a7e155a17cc360ac35664ad33fa8f640a1d6786100e"
        imagePullPolicy: IfNotPresent
        resources:
          requests: {cpu: 25m, memory: 32Mi}
          limits: {cpu: 100m, memory: 128Mi}
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          searchNamespace:
            - "observability"
          watchMethod: WATCH
          resource: configmap
          folderAnnotation: grafana_folder
          provider:
            name: git-authored
            orgid: 1
            folder: ""
            type: file
            disableDelete: false
            allowUiUpdates: false
            foldersFromFilesStructure: true
        datasources:
          enabled: false
      serviceMonitor:
        enabled: false
      plugins: []
