# TLS terminates here with the existing lab-CA wildcard certificate so Istio
# can enforce the HTTP method and path in the separately ordered route tier.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: observability-receiver
  namespace: istio-ingress
  labels:
    platform.garys-lab.io/cluster: obs-w
    platform.garys-lab.io/managed-by: ansible-platform-bootstrap
spec:
  selector:
    app: observability-ingress
  servers:
    - port:
        number: 443
        name: receiver-https
        protocol: HTTPS
      hosts:
        - "receiver.obs-w.int.garys-lab.io"
      tls:
        mode: SIMPLE
        credentialName: obs-w-wildcard-tls
