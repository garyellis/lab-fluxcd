apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: observability-ingress
  namespace: istio-ingress
spec:
  interval: 10m
  releaseName: observability-ingress
  chart:
    spec:
      chart: istio-gateway
      version: "0.1.3"
      sourceRef:
        kind: HelmRepository
        name: lab-charts
        namespace: flux-system
      interval: 10m
  install:
    createNamespace: false
    remediation: {retries: 3}
  upgrade:
    remediation: {retries: 3}
  targetNamespace: istio-ingress
  values:
    appsGateway:
      enabled: false
    certManager:
      enabled: false
    routes:
      hubbleUi:
        enabled: false
    gateway:
      labels:
        app: observability-ingress
        istio: observability-ingress
      replicaCount: 1
      autoscaling:
        enabled: false
      # The only node is intentionally schedulable. Empty placement values
      # replace the wrapper's edge-worker defaults.
      affinity: {}
      tolerations: []
      service:
        type: LoadBalancer
        annotations: {}
        loadBalancerClass: io.cilium/node
        ports:
          - name: status-port
            port: 15021
            protocol: TCP
            targetPort: 15021
          - name: https
            port: 443
            protocol: TCP
            targetPort: 8443
