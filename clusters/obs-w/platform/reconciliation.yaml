apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-sources
  namespace: flux-system
spec:
  interval: 10m
  path: clusters/obs-w/platform/sources
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-secrets
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 10m
  path: clusters/obs-w/platform/secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-core
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-sources
    - name: platform-secrets
  interval: 10m
  path: clusters/obs-w/platform/core
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 15m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-handoff
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-core
  interval: 10m
  path: clusters/obs-w/platform/handoff
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-ready
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-core
    - name: platform-handoff
  interval: 10m
  path: clusters/obs-w/platform/readiness
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lab-charts-source
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-ready
  interval: 10m
  path: clusters/obs-w/platform/sources/lab-charts
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-access
  namespace: flux-system
spec:
  interval: 10m
  path: clusters/obs-w/platform/access
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
