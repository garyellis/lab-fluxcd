schemaVersion: "1"
clusterName: k01dw
clusterRole: workload
clusterGroup: k01
environment: dw
managedBy: ansible-platform-bootstrap
# The platform profile this cluster was built to, from
# inventory/group_vars/<role>_clusters.yml. Ansible is authoritative for what a
# cluster is; OpenTofu's deployment_profile below is the label its VMs carry and
# is descriptive only, so the two are recorded separately rather than collapsed.
#
# revision is what makes a profile change detectable. Nothing migrates a running
# cluster onto a new revision -- a profile change is a teardown and rebuild, and
# this is the record that says which one this cluster is still on.
platformProfile:
  name: "promotion-micro"
  revision: 3
  workerProvider: "ansible"
  fluxCheckpoint: "control_plane"
  # Claimed, not observed. roles/platform_policy asserts these at preflight and
  # reports any shortfall there; this records what was asked for.
  capacityClaim:
    controlPlane:
      count: 1
      minVcpu: 2
      minMemoryMib: 1800
      enforcement: "fail"
    workers:
      count: 2
      minVcpu: 1
      minMemoryMib: 1800
      enforcement: "warn"
  services:
    - "platform-tenancy"
    - "hubble-ui-route"
    - "prometheus-operator"
    - "kube-state-metrics"
    - "metrics-collector"
# Edges this cluster registered its ingress with at vend time, and which one was
# given ownership of its DNS record. This is the only part of a vend that writes
# outside clusters/k01dw/, so it is the part most worth being able
# to audit from inside this file: it names every other tree this cluster
# touched. An empty list means the cluster registered nowhere and is reachable
# only on its own NodePorts.
edgeRegistrations:
  - name: "edge-w"
    publishDns: true
upstreamNodePort: 30443
provisioningProfile: "promotion-micro"
provisioningTopology: "single-control-plane-two-worker"
# Versions in effect when this cluster was vended. The Ansible inventory holds
# intent and changes over time; this records what was actually installed.
versions:
  kubernetes: "1.35.6"
  cilium: "1.20.0"
  flux: "2.9.3"
  istio: "1.28.2"
  # Istio is installed through the lab-charts wrappers, so the upstream version
  # above is not by itself enough to reproduce this cluster's mesh -- the
  # wrappers carry the sizing, mesh config, and Service annotations too.
  istioCharts:
    base: "0.1.0"
    istiod: "0.1.0"
    gateway: "0.1.3"
  metricsCharts:
    prometheusOperator: "0.1.1"
    alloy: "0.1.3"
    kubeStateMetrics: "0.1.0"
  metricsChartDigests:
    alloy: "sha256:e66e09374df769afd9ea62c9a0427949e6347a04f82f5e20177d474f6b426e7d"
    kubeStateMetrics: "sha256:d7f55ad8b425101d6b34da20f04ff9a39fc2af4b726cf8935414ffa501ca0260"
