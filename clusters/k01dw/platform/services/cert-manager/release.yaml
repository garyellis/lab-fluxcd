apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 10m
  chart:
    spec:
      chart: cert-manager
      version: "0.1.2"
      sourceRef:
        kind: HelmRepository
        name: lab-charts
        namespace: flux-system
      interval: 10m
  install:
    createNamespace: false
    remediation: {retries: 3}
  upgrade:
    remediation: {retries: 3}
  test:
    enable: true
    ignoreFailures: false
  targetNamespace: cert-manager
  values:
    # Values nest under the subchart name or they never reach cert-manager.
    cert-manager:
      # Verify DNS-01 challenges against public recursive resolvers instead of
      # walking to the zone's authoritative nameserver.
      #
      # This lab runs split authority (lab-k8s.md section 8): Cloudflare holds
      # the public garys-lab.io zone and is where ACME TXT records are written,
      # while Designate is internally authoritative for int.garys-lab.io and
      # cluster DNS forwards to it. cert-manager's self-check defaults to the
      # authoritative view, so it asks Designate for a record that is in
      # Cloudflare -- and gets an authoritative "no such record". The challenge
      # then stays pending forever, which blocks the Certificate, which blocks
      # workload-certificate, which blocks istio-gateway.
      #
      # Public resolvers are the view the ACME server itself validates from, so
      # this checks the same thing Let's Encrypt will check. It selects
      # resolvers to READ from and has no bearing on the DNS provider written
      # to -- that stays whatever the ClusterIssuer's solver declares.
      #
      # Set for every role although only the edge issues from ACME today.
      # Workload clusters use the internal lab-ca ClusterIssuer, which runs no
      # challenge at all, so these flags are never consulted there.
      dns01RecursiveNameservers: "1.1.1.1:53,8.8.8.8:53"
      dns01RecursiveNameserversOnly: true
