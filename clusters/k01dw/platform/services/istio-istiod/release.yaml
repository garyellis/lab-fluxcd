apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
  namespace: istio-system
spec:
  interval: 10m
  chart:
    spec:
      chart: istiod
      version: "0.1.0"
      sourceRef:
        kind: HelmRepository
        name: lab-charts
        namespace: flux-system
      interval: 10m
  install:
    createNamespace: false
    remediation: {retries: 3}
  upgrade:
    remediation: {retries: 3}
  test:
    enable: true
    ignoreFailures: false
  targetNamespace: istio-system
  values:
    istiod:
      # The wrapper defaults to 2 for a multi-control-plane cluster. Every
      # cluster in this fleet has exactly one control-plane node and the
      # wrapper pins istiod to it, so a second replica cannot improve
      # availability -- it only doubles the memory reserved on the one node
      # that also runs etcd and the apiserver.
      replicaCount: 1
      global:
        # meshID and network are fleet constants, NOT per-cluster values. Every
        # cluster is an independent mesh today, but meshID feeds the SPIFFE trust
        # domain: changing it later invalidates every workload certificate and
        # forces a full mesh re-bootstrap. Setting it once now is what keeps mesh
        # federation a later optimization rather than a rebuild.
        #
        # network is likewise shared: east and west are logical promotion regions
        # on one flat 10.128.0.0/24. Distinct network values would tell Istio the
        # clusters are not directly reachable and push traffic through east-west
        # gateways that do not exist.
        meshID: lab-mesh
        network: lab
        multiCluster:
          # Unique per cluster. This is the value that must differ.
          clusterName: k01dw
