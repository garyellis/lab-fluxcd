apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-operator
  namespace: monitoring
spec:
  interval: 10m
  releaseName: prometheus-operator
  chart:
    spec:
      chart: prometheus-operator
      version: "0.1.1"
      sourceRef:
        kind: HelmRepository
        name: lab-charts
        namespace: flux-system
      interval: 10m
  install:
    createNamespace: false
    crds: CreateReplace
    remediation: {retries: 3}
  upgrade:
    crds: CreateReplace
    remediation: {retries: 3}
  targetNamespace: monitoring
  values:
    # Every role receives the CRDs. Only the observability hub runs the
    # controller; spoke Alloy instances watch ServiceMonitor, PodMonitor, and
    # Probe resources directly.
    prometheus-operator:
      crds:
        enabled: true
      defaultRules:
        create: false
      prometheus:
        enabled: false
      alertmanager:
        enabled: false
      grafana:
        enabled: false
      thanosRuler:
        enabled: false
      nodeExporter:
        enabled: false
      kubeStateMetrics:
        enabled: false
      windowsMonitoring:
        enabled: false
      prometheusOperator:
        enabled: false
        serviceMonitor:
          selfMonitor: false
      kubernetesServiceMonitors:
        enabled: false
      kubeApiServer:
        enabled: false
      kubelet:
        enabled: false
      kubeControllerManager:
        enabled: false
      coreDns:
        enabled: false
      kubeDns:
        enabled: false
      kubeEtcd:
        enabled: false
      kubeScheduler:
        enabled: false
      kubeProxy:
        enabled: false
