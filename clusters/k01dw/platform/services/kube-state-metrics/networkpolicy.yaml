# Host-network Alloy is represented to Cilium as the host entity. This policy
# admits only that collector and permits KSM to read only the Kubernetes API.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kube-state-metrics
  namespace: observability
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  ingress:
    - fromEntities: [host]
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
  egress:
    - toEntities: [kube-apiserver]
