apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openstack-cinder-csi
  namespace: flux-system
spec:
  dependsOn:
    - name: openstack-cloud-controller-manager
  interval: 30m
  releaseName: openstack-cinder-csi
  targetNamespace: kube-system
  storageNamespace: kube-system
  chart:
    spec:
      chart: openstack-cinder-csi
      version: 2.35.0
      sourceRef:
        kind: HelmRepository
        name: openstack-cloud-controller-manager
        namespace: flux-system
      interval: 1h
  install:
    remediation: {retries: 3}
  upgrade:
    remediation: {retries: 3}
  values:
    clusterID: "k01tw"

    secret:
      enabled: true
      hostMount: false
      create: false
      filename: cloud.conf
      name: "cloud-config"

    # The platform owns one explicitly named class instead of the chart's fixed
    # delete/retain class names.
    storageClass:
      enabled: false

    priorityClassName: system-node-critical

    csi:
      attacher:
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 200m, memory: 256Mi}
      provisioner:
        topology: "true"
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}
      snapshotter:
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 200m, memory: 256Mi}
      resizer:
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 200m, memory: 256Mi}
      livenessprobe:
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: 100m, memory: 128Mi}
      nodeDriverRegistrar:
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: 100m, memory: 128Mi}
      plugin:
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 200m, memory: 256Mi}
        controllerPlugin:
          replicas: 1
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
        nodePlugin:
          nodeSelector: {}
          tolerations:
            - operator: Exists
